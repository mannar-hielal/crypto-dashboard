name: Deploy

on:
  # Triggers AFTER the CI workflow finishes on main — no duplicate runs
  # CI (one job) already handles type-check/lint/tests (with coverage floors), the Postgres integration
  # tests (migrations, drift, repository), the build and the browser smoke; deploy only needs to know
  # the whole workflow passed — a migration that drifts from schema.prisma must block a deploy. The
  # release PR's full e2e set is checked in the first step below.
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Deploy to Fly.io + Cloudflare Pages
    runs-on: ubuntu-latest
    # Only deploy if CI actually succeeded — never deploy a broken build.
    # 🔐 And only for a push to main in this repository: `branches: [main]` matches the *head* branch
    # name, so on a public repo a fork's PR from a branch called `main` would pass it, and its CI
    # success would deploy the fork's commit with the production secrets
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    environment: production
    # 🔐 Read-only token: the release gate below only reads the PR and its check runs
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      # The release gate (git.md): the develop → main PR this commit came from must have a green
      # "E2E full set (Playwright)" on its head. Fails closed: no merged release PR, or no green run,
      # means no deploy (re-run that check on the PR, then re-run this deploy).
      - name: Require the release PR's full e2e set
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            -q '[.[] | select(.base.ref == "main" and .head.ref == "develop" and .merged_at != null)][0].head.sha // empty')
          if [ -z "$head" ]; then
            echo "::error::No merged develop → main PR for $SHA — deploys only follow a release PR"
            exit 1
          fi
          green=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=E2E%20full%20set%20(Playwright)" \
            -q '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "${green:-0}" -eq 0 ]; then
            echo "::error::E2E full set (Playwright) is not green on the release PR head $head"
            exit 1
          fi
          echo "Release PR head $head: E2E full set green"

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Pin to the exact commit CI validated — prevents deploying a different
          # commit if new pushes land on main between CI finishing and deploy starting
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          # Dummy value — satisfies prisma generate postinstall; no DB operations here
          DATABASE_URL: postgresql://placeholder
        run: pnpm install --frozen-lockfile

      # ── Server ────────────────────────────────────────────────────────────────
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy server to Fly.io
        # --ha=false — Phase 1 is single-machine; no need for a second HA machine.
        # Saves ~50% of app compute cost. Re-enable when traffic justifies it.
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── Client ────────────────────────────────────────────────────────────────
      - name: Build client
        # VITE_API_URL is baked into the JS bundle at build time — must point at
        # the live Fly.io server, not localhost
        run: pnpm build
        working-directory: apps/client
        env:
          VITE_API_URL: https://api.cryptopapertrade.com

      - name: Deploy client to Cloudflare Pages
        # wrangler reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID from env
        # --branch=main tells Cloudflare this is a production deployment
        run: pnpm exec wrangler pages deploy dist --project-name=crypto-dashboard --branch=main
        working-directory: apps/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Production smoke (T5) ─────────────────────────────────────────────────
      # Read-only checks against the live site (apps/e2e/tests-prod): API health, a clean signed-out
      # page load, the login page, a live market feed. A failure marks this deploy red.
      - name: Install Chromium for the production smoke
        run: pnpm --filter @crypto-dashboard/e2e exec playwright install --with-deps chromium

      - name: Production smoke
        env:
          CI: 'true'
        run: |
          sleep 20 # let the new Pages build and the Fly machine settle
          pnpm --filter @crypto-dashboard/e2e test:prod
