name: CI

on:
  # Docs-only changes don't run CI (a docs-only release to main then doesn't deploy either — nothing
  # to ship). Exceptions: docs/TRADING_TEST_PLAN.md is read by a test (the guide scenarios' case IDs),
  # and .claude/hooks/** is code (test:hooks) — both always run. `paths` with `!` rather than
  # `paths-ignore`, which can't re-include a file; the last matching pattern wins. e2e-nightly.yml's
  # release-PR trigger uses the same list (deploy.yml's gate needs its run whenever CI runs).
  push:
    branches: [main, develop] # avoids duplicate runs — PRs already trigger the pull_request event
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/TRADING_TEST_PLAN.md'
  pull_request:
    branches: [main, develop]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/TRADING_TEST_PLAN.md'
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # One job, not three: one checkout, install and Postgres per run, and one per-job minute rounding
    # (Actions budget, git.md). Every check runs even after another one failed (only a failed
    # install stops the rest), so a run reports all its failures at once.
    name: CI (checks, integration, e2e smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The throwaway service's own credentials: the integration tests use crypto_dashboard_int, and the
    # e2e server creates crypto_dashboard_e2e_test itself
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_dashboard_int
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml # single root lockfile — workspace covers all packages

      - name: Install dependencies
        id: install
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres # dummy value — prisma generate only
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # 🔐 Fails on high/critical CVEs — low/moderate advisories are warnings only.
        # Run `pnpm audit --fix` locally to auto-resolve where possible.
        run: pnpm run audit

      - name: Type-check (server)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm type-check
        working-directory: apps/server

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint # root flat config already covers apps/client/** — no separate client lint step needed

      - name: Test (with coverage thresholds)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # test:coverage runs the same suites as `pnpm test` and fails below the floors in each
        # package's vitest.config.ts; the hook tests run separately
        run: pnpm test:coverage && pnpm test:hooks && pnpm test:scripts

      - name: Case-ID coverage (tags cite real rows; no ⬜ row that has a test)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm case-coverage --strict

      - name: Integration tests (Postgres)
        # A real Postgres, migrated from empty: migration drift and the AccountRepository round-trip
        # (T2i, docs/TRADING_TEST_PLAN.md roadmap P1)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_dashboard_int
        run: pnpm --filter @crypto-dashboard/server test:int

      - name: Build (server)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
        working-directory: apps/server

      - name: Build (client)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
        working-directory: apps/client

      # Playwright on the app with the fake Bybit feed and the test hooks (T3, docs/TRADING_TEST_PLAN.md
      # roadmap P2, M4): sign-up + verify, a Spot market buy, a perp long opened and closed. The hooks' secret is
      # generated per run.
      - name: Type-check the e2e package
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @crypto-dashboard/e2e type-check

      - name: Install Chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @crypto-dashboard/e2e exec playwright install --with-deps chromium

      - name: E2E smoke tests (Playwright)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        env:
          CI: 'true'
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_dashboard_e2e_test
        run: pnpm --filter @crypto-dashboard/e2e test:smoke

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
