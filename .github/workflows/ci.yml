name: CI

on:
  push:
    branches: [main, develop] # avoids duplicate runs — PRs already trigger the pull_request event
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml # single root lockfile — workspace covers all packages

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # installs root + all workspace packages (server, future client)

      - name: Type-check
        run: pnpm type-check
        working-directory: apps/server

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        working-directory: apps/server
