name: Bybit testnet parity

# T4 in docs/TRADING_TEST_PLAN.md (roadmap P3): replays a fixed BTCUSDT scenario on Bybit testnet and
# on the paper engine and diffs the v5 fields (apps/server/src/tools/bybitParity.ts). It places real
# testnet orders, so it runs nightly, on demand, and on same-repo PRs that change the parity code —
# never for fork PRs, which get no secrets.

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/parity.yml'
      - 'apps/server/src/tools/bybitParity.ts'
      - 'apps/server/src/trading/bybitParity.ts'

permissions:
  contents: read
  issues: write # open / update the "parity" issue on a scheduled failure

# 🔐 One run at a time: every run trades on the same testnet account
concurrency:
  group: bybit-testnet-parity
  cancel-in-progress: false

jobs:
  parity:
    name: Bybit testnet parity
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres # dummy — prisma generate only
        run: pnpm install --frozen-lockfile

      - name: Run the parity scenario on Bybit testnet
        env:
          # 🔐 Testnet only: the script refuses to trade unless BYBIT_TESTNET is true
          BYBIT_TESTNET: 'true'
          BYBIT_API_KEY: ${{ secrets.BYBIT_TESTNET_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_TESTNET_SECRET }}
          # Required by config.ts but unused by the script (no database, Redis or auth) — dummies
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: parity-run-dummy-secret-not-used-000000
          ADMIN_EMAIL: parity@example.invalid
          NODE_ENV: development
          LOG_LEVEL: info
        shell: bash
        run: |
          set -o pipefail
          if [ -z "$BYBIT_API_KEY" ] || [ -z "$BYBIT_API_SECRET" ]; then
            echo "::error::BYBIT_TESTNET_KEY / BYBIT_TESTNET_SECRET repo secrets are not set"
            exit 1
          fi
          pnpm --filter @crypto-dashboard/server parity:testnet 2>&1 | tee parity.log

      - name: Upload the parity log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: parity-log-${{ github.run_id }}
          path: parity.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Open or update the parity issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh label create parity --color B60205 --description "Bybit testnet parity mismatch" 2>/dev/null || true
          body="The Bybit testnet parity run failed on $(date -u +%Y-%m-%d): $RUN_URL

          Download the \`parity-log\` artifact for the step-by-step diff. Either fix the engine, or record
          the difference as a known gap in docs/APP_LOG.md → Bybit Parity."
          existing=$(gh issue list --label parity --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Bybit testnet parity mismatch" --label parity --body "$body"
          fi
