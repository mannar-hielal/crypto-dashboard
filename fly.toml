# Fly.io application configuration
# Docs: https://fly.io/docs/reference/configuration/

app = "crypto-dashboard-api"
primary_region = "sin" # Singapore — closest to Bybit's infrastructure

[build]
dockerfile = "apps/server/Dockerfile"

[env]
NODE_ENV = "production"
PORT     = "3001"
CLIENT_URL = "https://cryptopapertrade.com"
CORS_ORIGIN = "https://cryptopapertrade.com"
# All secrets (DATABASE_URL, REDIS_URL, JWT_SECRET, etc.) are set via:
#   fly secrets set KEY=value
# Never put secrets in this file.

[deploy]
release_command = "pnpm exec prisma migrate deploy"

[http_service]
internal_port        = 3001
force_https          = true
auto_stop_machines   = "stop"   # stops the machine when idle — saves cost
auto_start_machines  = true     # wakes it up on the first request
min_machines_running = 1        # keep 1 always warm — no cold starts for the API

[http_service.concurrency]
type       = "connections"
hard_limit = 100  # single shared-cpu-1x machine; 250 was oversized
soft_limit = 80

[[http_service.checks]]
grace_period = "15s"
interval     = "30s"
method       = "GET"
path         = "/health"
timeout      = "5s"

[[vm]]
memory   = "512mb"
cpu_kind = "shared"
cpus     = 1
