<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151b35"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>
    <linearGradient id="trendLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3A5"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <!-- Subtle indigo border -->
  <rect width="100" height="100" rx="22" fill="none" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- Candlestick 1: Bearish (left, red) -->
  <line x1="24" y1="27" x2="24" y2="73" stroke="#F43F5E" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="18" y="43" width="12" height="19" rx="2.5" fill="#F43F5E"/>
  <!-- Candlestick 2: Bullish (center, teal) -->
  <line x1="50" y1="20" x2="50" y2="68" stroke="#22D3A5" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="44" y="32" width="12" height="23" rx="2.5" fill="#22D3A5"/>
  <!-- Candlestick 3: Bullish (right, teal, highest) -->
  <line x1="76" y1="15" x2="76" y2="60" stroke="#22D3A5" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="70" y="25" width="12" height="23" rx="2.5" fill="#22D3A5"/>
  <!-- Rising trend line (indigo to teal, glowing) -->
  <polyline points="24,43 50,32 76,25" stroke="url(#trendLine)" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Glowing dots at each node -->
  <circle cx="24" cy="43" r="2.8" fill="#6366F1" filter="url(#glow)"/>
  <circle cx="50" cy="32" r="2.8" fill="#8183F4" filter="url(#glow)"/>
  <circle cx="76" cy="25" r="2.8" fill="#22D3A5" filter="url(#glow)"/>
</svg>
