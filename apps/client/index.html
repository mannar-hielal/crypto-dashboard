<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA: controls browser chrome color on mobile -->
    <meta name="theme-color" content="#080B14" />

    <!-- PWA: iOS specific — enables standalone mode when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- PWA: Android/Chrome — standard equivalent of apple-mobile-web-app-capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="cryptopapertrade.com" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Responsive viewport — critical for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <meta name="description" content="Paper trade crypto with real-time Bybit price feeds" />
    <link rel="canonical" href="https://cryptopapertrade.com/" />

    <!-- Open Graph — fallback defaults; per-page overrides via react-helmet-async -->
    <meta property="og:title" content="cryptopapertrade.com" />
    <meta property="og:description" content="Paper trade crypto with real-time Bybit price feeds" />
    <meta property="og:image" content="https://cryptopapertrade.com/og-image.svg" />
    <meta property="og:url" content="https://cryptopapertrade.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="cryptopapertrade.com" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="cryptopapertrade.com" />
    <meta
      name="twitter:description"
      content="Paper trade crypto with real-time Bybit price feeds"
    />
    <meta name="twitter:image" content="https://cryptopapertrade.com/og-image.svg" />

    <title>cryptopapertrade.com</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
