<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA: controls browser chrome color on mobile -->
    <meta name="theme-color" content="#080B14" />

    <!-- PWA: iOS specific — enables standalone mode when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CryptoDash" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Responsive viewport — critical for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO + social sharing basics -->
    <meta name="description" content="Paper trade crypto with real-time Bybit price feeds" />

    <title>Crypto Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
