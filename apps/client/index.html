<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA: controls browser chrome color on mobile -->
    <meta name="theme-color" content="#080B14" />

    <!-- PWA: iOS specific — enables standalone mode when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- PWA: Android/Chrome — standard equivalent of apple-mobile-web-app-capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="cryptopapertrade.com" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Responsive viewport — critical for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Content Security Policy — browser-enforced for the SPA -->
    <!-- 'unsafe-inline' on style-src required by Framer Motion animated styles -->
    <!-- frame-ancestors and report-uri omitted here — they are header-only
         directives and are already set via server Helmet middleware -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://static.cloudflareinsights.com;
        style-src 'self' 'unsafe-inline';
        connect-src 'self' http://localhost:3001 ws://localhost:3001 https://crypto-dashboard-api.fly.dev https://api.cryptopapertrade.com;
        img-src 'self' data: blob:;
        font-src 'self' data:;
        worker-src 'self' blob:;
        base-uri 'none';
        form-action 'self';
      "
    />

    <!-- SEO -->
    <meta
      name="description"
      content="Paper trade crypto with real-time Bybit price feeds"
      data-rh="true"
    />
    <link rel="canonical" href="https://cryptopapertrade.com/" data-rh="true" />

    <!-- Open Graph — fallback defaults; per-page overrides via react-helmet-async -->
    <meta property="og:title" content="cryptopapertrade.com" data-rh="true" />
    <meta
      property="og:description"
      content="Paper trade crypto with real-time Bybit price feeds"
      data-rh="true"
    />
    <meta property="og:image" content="https://cryptopapertrade.com/og-image.svg" data-rh="true" />
    <meta property="og:url" content="https://cryptopapertrade.com/" data-rh="true" />
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="cryptopapertrade.com" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:title" content="cryptopapertrade.com" data-rh="true" />
    <meta
      name="twitter:description"
      content="Paper trade crypto with real-time Bybit price feeds"
      data-rh="true"
    />
    <meta name="twitter:image" content="https://cryptopapertrade.com/og-image.svg" data-rh="true" />

    <title>cryptopapertrade.com</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
